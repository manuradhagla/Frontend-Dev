<!DOCTYPE html>
<html lang="en">
<head>

  <title>Photo Gallery</title>
  <link rel="stylesheet" href="Gallery.css" />
</head>
<body>
  <section class="gallery">

      <img src="mout.webp" alt="Mountain View" />

    <div class="photo">
      <img src="light.webp" alt="City Lights" />
      <div class="caption">City Lights</div>

    <div class="photo">
      <img src="forest.webp" alt="Forest Trail" />
      <div class="caption">Forest Trail</div>
    </div>
    <div class="photo">
      <img src="ocean.webp" alt="Ocean Breeze" />
      <div class="caption">Ocean Breeze</div>
    </div>
    
  </section>
</body>
</html>
