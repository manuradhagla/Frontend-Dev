<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Special Banner Offers</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        body {
            font-family: Segoe UI, Arial;
            margin: 16px
        }

        .banner {
            padding: 20px;
            border: 1px solid #ccc;
            margin: 8px
        }
    </style>
</head>

<body>
    <header>
        <h1>Special Offers</h1>
    </header>
    <main>
        <div id="banners">
            <div class="banner">Offer 1 - Buy 1 Get 1</div>
            <div class="banner">Offer 2 - 20% OFF</div>
            <div class="banner">Offer 3 - Free Shipping</div>
            <div class="banner">Offer 4 - Student Discount</div>
            <div class="banner">Offer 5 - Limited Time</div>
        </div>
        <div>
            <button id="hide">Hide</button>
            <button id="show">Show</button>
            <button id="slide">Slide Up/Down</button>
            <button id="fade">Fade In/Out</button>
        </div>
    </main>
    <footer><small>@copy by Manuradha Singh</small></footer>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="BannerOffer.js"></script>
</body>

</html>
