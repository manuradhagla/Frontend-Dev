<!DOCTYPE html>
<html lang="en">
<head>

    <title>Card Flip Animation</title>
    <link rel="stylesheet" href="card-flip.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="card-front">
                <img src="https://brajsansar.com/wp-content/uploads/2023/06/Banke-Bihari-Temple-Vrindavan.jpg">

            </div>

        </div>
    </div>
