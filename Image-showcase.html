<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="Image-showcase.css">
</head>

<body>
    <header>
        <h1>Image Showcase Layout</h1>
    </header>

    <main>
        <section class="gallery">
            <figure>
                <img src="img1.webp" alt="Sample 1">
                <figcaption>Lotus</figcaption>
            </figure>
            <figure>
                <img src="img2.webp" alt="Sample 2">
                <figcaption>Rose</figcaption>
            </figure>
            <figure>
                <img src="img3.webp" alt="Sample 3">
                <figcaption>Chrysanthemum</figcaption>
            </figure>
            <figure>
                <img src="img4.webp" alt="Sample 4">
                <figcaption>Daisy</figcaption>
            </figure>
            <figure>
                <img src="img5.webp" alt="Sample 5">
                <figcaption>Camellia</figcaption>
            </figure>
            <figure>
                <img src="img6.webp" alt="Sample 6">
                <figcaption>Lily</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>Image Showcase Example</p>
    </footer>
</body>

</html>
