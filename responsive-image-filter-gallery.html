<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="responsive-image-filter-gallery.css" />
</head>

<body>
  <!--
    Q1. Responsive Image Filter Gallery
    - CSS Grid gallery with 6 images
    - Different filters on each
    - Hover removes filter with transition
    - Captions below each image
    - Stacks to one column below 600px
  -->
  <header class="site-header">
    <h1>Responsive Image Filter Gallery</h1>
    <p class="subtitle">Hover to remove filters</p>
  </header>

  <main class="gallery">
    <figure class="card blur">
      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470" alt="Mountain lake" />
      <figcaption>Blur</figcaption>
    </figure>

    <figure class="card grayscale">
      <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a" alt="Puppy portrait" />
      <figcaption>Grayscale</figcaption>
    </figure>

    <figure class="card sepia">
      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470" alt="Forest path" />
      <figcaption>Sepia</figcaption>
    </figure>

    <figure class="card brightness">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="Sea cliffs" />
      <figcaption>Brightness</figcaption>
    </figure>

    <figure class="card contrast">
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee" alt="Desert dunes" />
      <figcaption>Contrast</figcaption>
    </figure>

    <figure class="card hue">
      <img src="https://images.unsplash.com/photo-1494783367193-149034c05e8f" alt="City skyline" />
      <figcaption>Hue Rotate</figcaption>
    </figure>
  </main>


  <footer class="site-footer">
    <small>© 2025 Responsive CSS Exercises</small>
  </footer>
</body>

</html>
