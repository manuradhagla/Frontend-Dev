<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            box-sizing: border-box;
            font-family: "Courier New", Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #e2e8f0;
        }

        .container {
            width: 230px;
            background-color: rgb(26, 73, 113);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
        }

        input {
            width: 200px;
            height: 40px;
            font-size: 18px;
            text-align: right;
            margin-bottom: 10px;
            border: none;
            border-radius: 5px;
            padding-right: 10px;
        }

        .btn-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
        }

        button {
            width: 50px;
            height: 40px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #d1d5db;
        }

        .result {
            background-color: #10b981;
            color: white;
        }

        .clear {
            background-color: #ef4444;
            color: white;
        }
    </style>
</head>

<body>
    <section class="container">
        <input type="text" placeholder="Result" readonly id="input" />

        <div class="btn-container">
            <button value="1" onclick="cal('1')">1</button>
            <button value="2" onclick="cal('2')">2</button>
            <button value="3" onclick="cal('3')">3</button>
            <button value="4" onclick="cal('4')">4</button>
            <button value="5" onclick="cal('5')">5</button>
            <button value="6" onclick="cal('6')">6</button>
            <button value="7" onclick="cal('7')">7</button>
            <button value="8" onclick="cal('8')">8</button>
            <button value="9" onclick="cal('9')">9</button>
            <button value="0" onclick="cal('0')">0</button>
            <button value="+" onclick="cal('+')">+</button>
            <button value="-" onclick="cal('-')">-</button>
            <button value="" onclick="cal('')">*</button>
            <button value="/" onclick="cal('/')">/</button>
            <button class="clear" onclick="clearInput()">C</button>
            <button class="result" onclick="getResult()">=</button>
        </div>

    </section>
    <button onclick="abc()"> click me </button>
    <p id="data">
    </p>

    <script>
        function abc() {
            let data = document.getElementById("data");
            console.log(document.getElementById("data").removeChild);
            data.innerText = " HII this code written by the code"
        }
        let result = "";
        function cal(value) {
            result += value;
            document.getElementById("input").value = result;
        }
        function clearInput() {
            result = "";
            document.getElementById("input").value = "";
        }
        // Calculate and show the result using eval()
        function getResult() {
            result = eval(result);
            document.getElementById("input").value = result;
        }
    </script>
</body>

</html>
