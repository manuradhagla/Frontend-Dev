<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="Tooltip.css">
</head>

<body>
    <header>
        <h1>We are doing CSS Tooltip Demonstration</h1>
        <p>Hover over the items below to see tooltips.</p>
    </header>

    <main>
        <section class="container">
            <div class="tooltip">
                <span class="word">HTML</span>
                <span class="tooltip-text">HyperText Markup Language</span>
            </div>

            <div class="tooltip">
                <span class="word">CSS</span>
                <span class="tooltip-text">Cascading Style Sheets</span>
            </div>

            <div class="tooltip">
                <span class="word">Flexbox</span>
                <span class="tooltip-text">CSS layout model for alignment</span>
            </div>
        </section>
    </main>

    <footer>
        <p>Created by Manuradha | Frontend-Dev Practice</p>
    </footer>
</body>

</html>
